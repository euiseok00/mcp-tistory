services:
  # Tailscale Funnel: https://tistory-mcp.<tailnet>.ts.net 고정 주소로 공개
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: tistory-mcp
    environment:
      # 첫 실행에만 필요. 이후엔 tailscale-state 볼륨의 노드 정보로 접속
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Docker Desktop(Windows)에서 /dev/net/tun 없이 동작
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  mcp:
    build: .
    # tailscale 컨테이너와 네트워크를 공유해 serve.json의 127.0.0.1:3000으로 받는다
    network_mode: service:tailscale
    depends_on: [tailscale]
    env_file: .env
    environment:
      # .env의 PUBLIC_URL. 비어 있으면 서버가 시작을 거부한다
      PUBLIC_URL: ${PUBLIC_URL:-}
      PORT: "3000"
      TISTORY_COOKIE_FILE: /run/secrets/tistory_cookie.txt
      # 재빌드·재시작해도 커넥터 재인가가 필요 없게 OAuth 상태를 볼륨에 둔다
      OAUTH_STATE_FILE: /app/data/oauth.json
    volumes:
      - ./secrets:/run/secrets:ro
      - mcp-state:/app/data
    restart: unless-stopped

volumes:
  tailscale-state:
  mcp-state:
